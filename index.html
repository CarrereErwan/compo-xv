<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Compo XV</title>
<meta name="description" content="Créateur de visuels de composition d'équipe de rugby, 100% hors-ligne.">
<meta name="theme-color" content="#1E6B47">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F3F6F0;
  --surface:#FFFFFF;
  --surface-2:#E9EFE4;
  --border:#D6E0CE;
  --text:#182018;
  --text-muted:#5B6B57;
  --accent:#1E6B47;
  --accent-contrast:#FFFFFF;
  --gold:#C2841F;
  --gold-contrast:#20140A;
  --danger:#B23A22;
  --danger-contrast:#FFFFFF;
  --shadow:0 1px 2px rgba(20,30,20,.06), 0 6px 16px -6px rgba(20,30,20,.16);
  --radius-sm:10px;
  --radius-md:16px;
  --font-display:'Oswald','Arial Narrow',sans-serif;
  --font-body:'Work Sans',system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --surface:#161F1A; --surface-2:#1D2921; --border:#2A3A2E;
    --text:#E9F0E5; --text-muted:#9BAC98; --accent:#57C48A; --accent-contrast:#0A1710;
    --gold:#E3B15A; --gold-contrast:#241704; --danger:#E5806A; --danger-contrast:#2A0B03;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -8px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --surface:#161F1A; --surface-2:#1D2921; --border:#2A3A2E;
  --text:#E9F0E5; --text-muted:#9BAC98; --accent:#57C48A; --accent-contrast:#0A1710;
  --gold:#E3B15A; --gold-contrast:#241704; --danger:#E5806A; --danger-contrast:#2A0B03;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -8px rgba(0,0,0,.55);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;}
img{max-width:100%;}
[hidden]{display:none!important;}
button,input,select,textarea{font-family:inherit;}
h1,h2,h3{text-wrap:balance;font-family:var(--font-display);margin:0;}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){ *{transition-duration:.001ms!important;animation-duration:.001ms!important;} }

.app{display:flex;flex-direction:column;height:100%;}
.app-header{flex:0 0 auto;padding:14px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);background:var(--surface);}
.header-text{flex:1;min-width:0;overflow:hidden;}
.header-text .brand,.header-text .header-sub{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:1.25rem;letter-spacing:.02em;}
.brand-mark{font-size:1.3rem;}
.header-sub{color:var(--text-muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;}
.offline-pill{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);font-size:.68rem;font-weight:600;padding:.3em .6em;border-radius:999px;white-space:nowrap;flex:0 0 auto;}
.offline-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--text-muted);}
.offline-pill.is-online .dot{background:#2FAE60;}
.offline-pill.is-warning{border-color:var(--danger);color:var(--danger);cursor:pointer;}
.offline-pill.is-warning .dot{background:var(--danger);}
.content{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:96px;}
.view{display:none;}
.view.active{display:block;}
.tabbar{flex:0 0 auto;display:flex;border-top:1px solid var(--border);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 8px;background:none;border:none;color:var(--text-muted);font-size:.7rem;font-weight:600;}
.tab-icon{font-size:1.3rem;}
.tab-active{color:var(--accent);}

.view-toolbar{display:flex;align-items:center;justify-content:space-between;padding:18px 16px 12px;gap:12px;}
.view-toolbar h2{font-size:1.3rem;}

.btn{border:none;border-radius:999px;padding:.65em 1.2em;font-weight:600;font-size:.9rem;cursor:pointer;}
.btn-accent{background:var(--accent);color:var(--accent-contrast);}
.btn-secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
.btn-ghost{background:transparent;color:var(--text-muted);}
.btn-danger{background:var(--danger);color:var(--danger-contrast);}
.btn-block{width:100%;}
.btn[disabled]{opacity:.5;}
.btn-icon{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:1.05rem;display:flex;align-items:center;justify-content:center;color:var(--text);flex:0 0 auto;}
.btn-icon-off{opacity:.4;}
.btn-icon-active{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}

.player-list,.compo-list{list-style:none;margin:0;padding:0 16px;display:flex;flex-direction:column;gap:10px;}
.player-row,.compo-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:10px 12px;box-shadow:var(--shadow);}
.player-photo{width:48px;height:48px;border-radius:50%;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:1.3rem;}
.player-photo img{width:100%;height:100%;object-fit:cover;}
.player-photo-sm{width:40px;height:40px;}
.player-info{flex:1 1 auto;min-width:0;}
.player-name{font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.player-pos{color:var(--text-muted);font-size:.78rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.player-number{font-family:var(--font-display);font-weight:700;font-size:1.15rem;color:var(--accent);font-variant-numeric:tabular-nums;min-width:1.6em;text-align:right;}

.compo-checkbox{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:.75rem;font-weight:700;color:var(--accent-contrast);}
.compo-checkbox.is-checked{background:var(--accent);border-color:var(--accent);}
.compo-thumb{width:48px;height:48px;border-radius:12px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:1.2rem;}
.compo-thumb img{width:100%;height:100%;object-fit:cover;}
.compo-info{flex:1;min-width:0;}
.compo-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.compo-meta{color:var(--text-muted);font-size:.78rem;}

.template-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 16px;}
.template-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;}
.template-thumb{position:relative;width:100%;background:var(--surface-2);}
.template-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.template-slot-count{position:absolute;left:8px;bottom:8px;background:rgba(8,14,10,.64);color:#fff;font-size:.66rem;font-weight:600;padding:.25em .55em;border-radius:999px;}
.template-badge{position:absolute;right:8px;top:8px;background:rgba(8,14,10,.64);color:#fff;font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:.25em .5em;border-radius:999px;}
.template-card-footer{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;gap:6px;}
.template-name{font-weight:600;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.template-card-actions{display:flex;gap:2px;flex:0 0 auto;}
.template-card-actions button{border:none;background:none;font-size:1.05rem;padding:7px;color:var(--text-muted);}
.list-controls{padding:0 16px 12px;display:flex;flex-direction:column;gap:8px;}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.chip-row .chip{flex:0 0 auto;}
.picker-tag{font-size:.66rem;color:var(--text-muted);background:var(--surface-2);padding:.15em .55em;border-radius:999px;margin-left:6px;white-space:nowrap;}

.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 24px;gap:10px;color:var(--text-muted);}
.empty-icon{font-size:2.4rem;}
.empty-state h3{color:var(--text);font-size:1.1rem;}
.empty-state p{max-width:32ch;font-size:.9rem;line-height:1.4;}
.hint-banner{margin:0 16px 12px;padding:10px 14px;background:var(--surface-2);border-radius:var(--radius-sm);color:var(--text-muted);font-size:.85rem;}
.member-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.member-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;background:var(--surface-2);border-radius:10px;font-size:.85rem;}
.member-email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.carousel-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
.carousel-strip img{height:180px;width:auto;border-radius:10px;border:1px solid var(--border);flex:0 0 auto;}

.editor-toolbar{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;}
.editor-title-input{flex:1;min-width:0;border:none;background:none;font-family:var(--font-display);font-size:1.1rem;font-weight:600;color:var(--text);padding:6px 4px;border-bottom:1px solid transparent;}
.editor-title-input:focus{outline:none;border-bottom-color:var(--accent);}
.editor-hint{margin:0 16px 12px;color:var(--text-muted);font-size:.82rem;}
.editor-bottom-actions{display:flex;gap:10px;padding:16px;}
.editor-bottom-actions .btn{flex:1;}

.canvas-wrap{padding:0 16px;}
.tpl-canvas{position:relative;width:100%;background:var(--surface-2);border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border);}
.tpl-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;pointer-events:none;user-select:none;}
.tpl-slots{position:absolute;inset:0;}
.tpl-slot{position:absolute;transform:translate(-50%,-50%);touch-action:none;container-type:inline-size;}
.tpl-slot.kind-photo,.tpl-slot.kind-logo{aspect-ratio:1;}
.tpl-slot-shape{width:100%;height:100%;overflow:hidden;background:rgba(0,0,0,.28);border:3px solid #000;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.3em;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:grab;}
.tpl-slot-shape img{width:100%;height:100%;object-fit:cover;display:block;}
.shape-circle{border-radius:50%;}
.shape-rect{border-radius:14%;}
.shape-oval{border-radius:50%;clip-path:ellipse(44% 50% at 50% 50%);}
.tpl-slot-shape.is-selected{outline:3px solid var(--gold);outline-offset:2px;}
.tpl-slot-shape.is-empty{background:rgba(0,0,0,.18);border-style:dashed;}
.slot-plus{font-size:1.6em;font-weight:300;opacity:.85;}
.slot-placeholder{opacity:.75;}
.tpl-slot-resize{position:absolute;right:-11px;bottom:-11px;width:26px;height:26px;border-radius:50%;background:var(--gold);border:2px solid var(--surface);touch-action:none;z-index:2;}
.slot-number-poster{position:absolute;left:50%;bottom:0;transform:translate(-50%,50%);font-family:var(--font-display);font-weight:700;font-size:58cqw;color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill;line-height:1;pointer-events:none;white-space:nowrap;}
.slot-number-poster.is-ghost{opacity:.55;}
.slot-captain-badge{position:absolute;right:-4%;top:24%;width:26%;aspect-ratio:1;border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:14cqw;border:2px solid #000;}
.tpl-slot-label{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:30%;white-space:nowrap;font-family:var(--font-display);color:#fff;-webkit-text-stroke:1.5px #000;paint-order:stroke fill;font-weight:700;font-size:15cqw;}
.tpl-slot-label.is-ghost{opacity:.55;-webkit-text-stroke:1.5px rgba(0,0,0,.5);}
.tpl-slot-role{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6%;white-space:nowrap;background:var(--gold);color:var(--gold-contrast);font-weight:700;font-size:10cqw;padding:.25em .55em;border-radius:999px;}
.tpl-slot-text{width:100%;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed rgba(0,0,0,.55);border-radius:8px;background:rgba(255,255,255,.12);color:#fff;font-weight:700;font-family:var(--font-display);-webkit-text-stroke:1px #000;paint-order:stroke fill;overflow:hidden;padding:2%;word-break:break-word;}
.tpl-slot-text.is-empty{color:rgba(255,255,255,.65);-webkit-text-stroke:0;font-family:var(--font-body);font-weight:600;font-size:.8em;background:rgba(0,0,0,.18);}
.kind-chip-row{display:flex;gap:8px;margin-bottom:14px;}
.kind-chip-row .chip{flex:1;text-align:center;}
.fab{position:fixed;right:20px;bottom:calc(90px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:none;background:var(--accent);color:var(--accent-contrast);font-size:1.6rem;box-shadow:var(--shadow);z-index:5;}
.fab-active{background:var(--danger);color:var(--danger-contrast);}
.align-guide{position:absolute;background:var(--gold);z-index:4;pointer-events:none;box-shadow:0 0 4px rgba(0,0,0,.5);}
.align-guide-v{top:0;bottom:0;width:2px;}
.align-guide-h{left:0;right:0;height:2px;}

.sheet-overlay{position:fixed;inset:0;background:rgba(8,12,9,0);z-index:20;display:flex;align-items:flex-end;justify-content:center;transition:background .25s;}
.sheet-overlay.is-open{background:rgba(8,12,9,.45);}
.sheet{width:100%;max-width:520px;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1);max-height:86vh;overflow-y:auto;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));}
.sheet-overlay.is-open .sheet{transform:translateY(0);}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--border);margin:6px auto 14px;}
.sheet-title{font-size:1.15rem;margin-bottom:14px;}
.sheet-msg{color:var(--text-muted);font-size:.88rem;margin:-6px 0 14px;}
.sheet-actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
.sheet-actions .btn{flex:1;}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;font-size:.82rem;color:var(--text-muted);font-weight:600;}
.field input,.field select,.field textarea{font-family:var(--font-body);font-size:.95rem;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:.6em .7em;}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}
.field-toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;font-size:.9rem;border-bottom:1px solid var(--border);}
.chip{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:.5em 1.1em;font-weight:600;font-size:.85rem;color:var(--text-muted);}
.chip-active{background:var(--accent);border-color:var(--accent);color:var(--accent-contrast);}
.search-input{width:100%;border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:.6em .8em;font-size:.9rem;margin-bottom:12px;}
.picker-list{list-style:none;margin:0;padding:0;max-height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;}
.picker-row{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;}
.picker-row.is-current{background:var(--surface-2);}

.form-photo{display:flex;justify-content:center;margin-bottom:16px;}
.photo-picker{border:none;background:none;padding:0;}
.photo-picker img,.photo-placeholder{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:2rem;border:2px dashed var(--border);}
.extra-photo-grid{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;}
.extra-photo{position:relative;width:64px;text-align:center;}
.extra-photo-thumb{width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--surface-2);display:flex;align-items:center;justify-content:center;border:1px solid var(--border);margin:0 auto 3px;}
.extra-photo-thumb img{width:100%;height:100%;object-fit:cover;}
.extra-photo-label{display:block;font-size:.62rem;color:var(--text-muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.extra-photo-remove{position:absolute;top:-6px;right:2px;width:18px;height:18px;border-radius:50%;background:var(--danger);color:var(--danger-contrast);border:2px solid var(--surface);font-size:.6rem;line-height:1;display:flex;align-items:center;justify-content:center;padding:0;}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px);background:#1c2620;color:#fff;padding:.7em 1.2em;border-radius:999px;font-size:.85rem;z-index:30;opacity:0;transition:opacity .25s,transform .25s;box-shadow:var(--shadow);max-width:80vw;text-align:center;}
.toast.is-visible{opacity:1;transform:translate(-50%,0);}

.loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:50;text-align:center;padding:0 32px;}
.loading.is-busy{background:rgba(8,12,9,.5);}
.loading-mark{font-size:2.6rem;}
.loading.is-busy .loading-mark{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#loadingText{color:var(--text-muted);font-size:.9rem;max-width:40ch;}
.loading.is-busy #loadingText{color:#fff;}

.auth-screen{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px;z-index:60;overflow-y:auto;}
.auth-card{width:100%;max-width:360px;}
.preview-overlay{position:fixed;inset:0;background:#0a0f0a;z-index:70;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));}
.preview-close{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:16px;background:rgba(255,255,255,.12);border-color:transparent;color:#fff;z-index:2;}
.preview-image-wrap{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding-top:44px;}
.preview-image-wrap img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.5);}
.preview-actions{display:flex;flex-direction:column;gap:10px;padding-top:16px;flex:0 0 auto;}
.format-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.format-card{border:2px solid var(--border);background:var(--surface-2);border-radius:12px;padding:10px;text-align:center;color:var(--text-muted);font-size:.8rem;font-weight:600;}
.format-card.is-selected{border-color:var(--accent);color:var(--accent);}
.format-swatch{margin:0 auto 6px;background:var(--border);border-radius:4px;}
</style>
</head>
<body>

<div id="loading" class="loading">
  <div class="loading-mark">🏉</div>
  <p id="loadingText">Chargement…</p>
</div>

<div id="authScreen" class="auth-screen" hidden>
  <div class="auth-card">
    <div class="brand" style="justify-content:center;margin-bottom:18px;"><span class="brand-mark">🏉</span><span class="brand-name">Compo&nbsp;XV</span></div>
    <div class="chip-row" style="justify-content:center;margin-bottom:16px;">
      <button type="button" class="chip chip-active" id="authTabSignin">Se connecter</button>
      <button type="button" class="chip" id="authTabSignup">Créer un compte</button>
    </div>
    <label class="field"><span>Email</span>
      <input type="email" id="authEmail" autocomplete="email" placeholder="toi@exemple.fr">
    </label>
    <label class="field"><span>Mot de passe</span>
      <input type="password" id="authPassword" autocomplete="current-password" placeholder="••••••••">
    </label>
    <p class="sheet-msg" id="authError" hidden style="color:var(--danger);"></p>
    <button type="button" class="btn btn-accent btn-block" id="authSubmit">Se connecter</button>
  </div>
</div>

<div id="groupScreen" class="auth-screen" hidden>
  <div class="auth-card">
    <div class="brand" style="justify-content:center;margin-bottom:8px;"><span class="brand-mark">🏉</span><span class="brand-name">Compo&nbsp;XV</span></div>
    <p class="sheet-msg" style="text-align:center;">Crée ton groupe (club) ou rejoins celui d’un coéquipier avec son code.</p>
    <div class="chip-row" style="justify-content:center;margin-bottom:16px;">
      <button type="button" class="chip chip-active" id="groupTabCreate">Créer un groupe</button>
      <button type="button" class="chip" id="groupTabJoin">Rejoindre</button>
    </div>

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open('compoxv', 2);
    req.onupgradeneeded = (e)=>{
      const d = e.target.result;
      if (!d.objectStoreNames.contains('players')) d.createObjectStore('players', {keyPath:'id'});
      if (!d.objectStoreNames.contains('templates')) d.createObjectStore('templates', {keyPath:'id'});
      if (!d.objectStoreNames.contains('posts')) d.createObjectStore('posts', {keyPath:'id'});
      if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos', {keyPath:'id'});
      if (!d.objectStoreNames.contains('logos')) d.createObjectStore('logos', {keyPath:'id'});
      if (!d.objectStoreNames.contains('settings')) d.createObjectStore('settings', {keyPath:'key'});
      if (!d.objectStoreNames.contains('outbox')) d.createObjectStore('outbox', {keyPath:'id'});
    };
    req.onsuccess = (e)=>{ idb = e.target.result; resolve(idb); };
    req.onerror = (e)=> reject(e.target.error);
  });
}
function cacheGetAll(store){
  return new Promise((resolve, reject)=>{
    const req = idb.transaction(store,'readonly').objectStore(store).getAll();
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}

}

    req.onerror = ()=> reject(req.error);
  });
}

    req.onsuccess = ()=> resolve();
    req.onerror = ()=> reject(req.error);
  });
}

async function ensureSession(){

async function pendingOutboxInfo(store){
  const upsertIds = new Set(), deleteIds = new Set();
  try{
    const items = await cacheGetAll('outbox');
    for (const it of items){
      if (it.store !== store) continue;
      const id = it.payload && it.payload.id;
      if (!id) continue;
      if (it.op === 'delete') deleteIds.add(id); else upsertIds.add(id);
    }
  }catch(err){}
  return { upsertIds, deleteIds };

async function idbGetAll(store){
  if (store==='settings') return [];
  await ensureSession();

    try{
      const { data, error } = await sb.from(store).select('*').eq('group_id', currentGroup.id);

      // Records with a write still queued in the outbox haven't reached the
      // server yet — trust the local (just-edited) version instead of
      // overwriting it with the stale row the server just returned.
      const { upsertIds, deleteIds } = await pendingOutboxInfo(store);
      const serverRows = data.map(FROM_ROW[store]).filter(r => !deleteIds.has(r.id));
      const freshRows = serverRows.filter(r => !upsertIds.has(r.id));
      for (const r of freshRows) await cachePut(store, r);
      if (upsertIds.size){
        const cachedAll = await cacheGetAll(store);
        const pendingRows = cachedAll.filter(r => upsertIds.has(r.id));
        return [...freshRows, ...pendingRows];
      }

    }catch(err){ console.error('fetch failed, using cache', store, err); }
  }

}

async function idbPut(store, obj){
  await ensureSession();
  await ensureGroup();
  if (!currentGroup) throw new Error('Aucun groupe actif — reconnecte-toi (touche la pastille en haut de l’écran) puis réessaie.');

async function purgeOutboxFor(store, id){

  await purgeOutboxFor(store, key);

// fields that matter, so a save that silently didn't take (server rejection
// swallowed somewhere, a stale write racing a fresher one, etc.) shows up as a
// clear warning instead of a value quietly reverting a moment later.
async function verifyWrite(store, id, expected, fields){
  if (!navigator.onLine || !sb || !currentGroup) return true;
  try{
    const { data, error } = await sb.from(store).select('*').eq('id', id).eq('group_id', currentGroup.id).maybeSingle();

    if (!data){ console.error('verifyWrite: record missing right after save', store, id); return false; }

    for (const f of fields){
      const a = JSON.stringify(actual[f] ?? null), b = JSON.stringify(expected[f] ?? null);
      if (a !== b){
        console.error(`verifyWrite mismatch on ${store}.${f}`, { sent: expected[f], serverHas: actual[f] });

      }
    }
    return true;
  }catch(err){ console.error('verifyWrite failed', err); return true; }
}

function resizeImage(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      let width = img.naturalWidth, height = img.naturalHeight;
      if (width > maxDim || height > maxDim){
        if (width > height){ height = Math.round(height * maxDim/width); width = maxDim; }
        else { width = Math.round(width * maxDim/height); height = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob((blob)=>{
        URL.revokeObjectURL(url);
        if (!blob){ reject(new Error('toBlob failed')); return; }
        resolve({blob, width, height});
      }, 'image/jpeg', quality);
    };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}
function resizeImageToExact(file, targetW, targetH, quality){
  return new Promise((resolve, reject)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = targetW; canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      drawCover(ctx, img, 0, 0, targetW, targetH);
      canvas.toBlob((blob)=>{
        URL.revokeObjectURL(url);
        if (!blob){ reject(new Error('toBlob failed')); return; }
        resolve({blob, width:targetW, height:targetH});
      }, 'image/jpeg', quality);
    };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}
function loadImage(src){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}
function drawCover(ctx, img, x, y, w, h){
  const ir = img.width/img.height, tr = w/h;
  let sx,sy,sw,sh;
  if (ir > tr){ sh = img.height; sw = sh*tr; sx = (img.width-sw)/2; sy = 0; }
  else { sw = img.width; sh = sw/tr; sx = 0; sy = (img.height-sh)/2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
function roundRectPath(ctx,x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}
function pathForSlot(ctx, slot, cx, cy, r, d){
  ctx.beginPath();
  if (slot.shape === 'oval'){ ctx.ellipse(cx, cy, r*0.88, r, 0, 0, Math.PI*2); }
  else if (slot.shape === 'circle'){ ctx.arc(cx,cy,r,0,Math.PI*2); }
  else { roundRectPath(ctx, cx-r, cy-r, d, d, d*0.14); }
}
function strokeFillText(ctx, text, x, y, fontPx, fontFamily, weight, fillColor, strokeRatio, align, baseline){
  ctx.font = `${weight} ${Math.round(fontPx)}px ${fontFamily}`;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = baseline || 'middle';
  ctx.lineJoin = 'round';
  ctx.miterLimit = 2;
  ctx.lineWidth = fontPx * strokeRatio;
  ctx.strokeStyle = '#000000';
  ctx.strokeText(text, x, y);
  ctx.fillStyle = fillColor;
  ctx.fillText(text, x, y);
}

function switchView(view){
  state.view = view;
  try{ localStorage.setItem('compoxv_view', view); }catch(err){}
  document.querySelectorAll('.tab').forEach(b=> b.classList.toggle('tab-active', b.dataset.view===view));

  if (!navigator.onLine) return;
  try{
    if (state.view==='effectif'){
      await refreshPlayers();
      if (state.view==='effectif') renderEffectifList();
    } else if (state.view==='design'){
      await refreshTemplates();

/* ---------- shared slot canvas ---------- */
function renderSlotsInCanvas(container, canvasEl, template, mode, extra){
  container.innerHTML = '';
  (template.slots||[]).forEach(slot=>{
    const kind = slot.kind || 'photo';
    const es = mode==='compo' ? effectiveSlot(slot, extra.slotOverrides) : slot;
    const wrap = document.createElement('div');
    wrap.className = 'tpl-slot kind-'+kind;
    wrap.style.left = (es.x*100)+'%';
    wrap.style.top = (es.y*100)+'%';
    wrap.style.width = (es.w*100)+'%';
    if (kind==='text') wrap.style.height = ((es.h!=null?es.h:0.08)*100)+'%';
    wrap.dataset.slotId = slot.id;

    if (kind==='text'){
      const box = document.createElement('div');
      let content = '';
      if (mode==='compo') content = extra.assignments[slot.id] || '';
      box.className = 'tpl-slot-text' + (content? '' : ' is-empty');
      box.style.fontSize = ((slot.fontSize!=null?slot.fontSize:0.05)*100)+'cqw';
      box.style.color = slot.color || '#ffffff';
      box.textContent = content || (mode==='design' ? (slot.placeholder||'Texte libre') : 'Toucher pour éditer');
      wrap.appendChild(box);
    } else {
      const shape = document.createElement('div');
      const selected = mode==='design' && state.design.selectedSlotId===slot.id;
      const shapeClass = slot.shape==='oval' ? 'shape-oval' : (slot.shape==='circle' ? 'shape-circle' : 'shape-rect');
      shape.className = 'tpl-slot-shape ' + shapeClass + (selected?' is-selected':'');

      let player = null;
      let logoImgId = null;
      if (mode==='compo'){
        const val = extra.assignments[slot.id];
        if (kind==='logo'){
          logoImgId = val || null;
          if (logoImgId) shape.innerHTML = `<img src="${escapeAttr(photoUrl(logoImgId))}" alt="">`;
          else { shape.classList.add('is-empty'); shape.innerHTML = `<span class="slot-plus">🛡️</span>`; }
        } else {
          player = val? (state.players.find(p=>p.id===val) || null) : null;
          const resolvedPhotoId = player ? resolvePlayerPhotoAssetId(player, template, extra.photoChoices, slot.id) : null;
          if (player && resolvedPhotoId){
            shape.innerHTML = `<img src="${escapeAttr(photoUrl(resolvedPhotoId))}" alt="">`;
          } else if (player){
            shape.innerHTML = `<span class="slot-placeholder">👤</span>`;
          } else {
            shape.classList.add('is-empty');
            shape.innerHTML = `<span class="slot-plus">+</span>`;
          }
        }
      } else {
        shape.innerHTML = kind==='logo' ? `<span class="slot-placeholder">🛡️</span>` : `<span class="slot-placeholder">👤</span>`;
      }

      wrap.appendChild(shape);

      if (kind==='photo'){
        if (mode==='compo' && player && slot.showNumber && player.number!=null){
          const badge = document.createElement('div');
          badge.className = 'slot-number-poster';
          badge.textContent = player.number;
          wrap.appendChild(badge);
        } else if (mode==='design' && slot.showNumber){
          const badge = document.createElement('div');
          badge.className = 'slot-number-poster is-ghost';
          badge.textContent = '0';
          wrap.appendChild(badge);
        }
        if (mode==='compo' && player && slot.showName && player.name){
          const label = document.createElement('div');
          label.className = 'tpl-slot-label';
          label.textContent = player.name;
          wrap.appendChild(label);
        } else if (mode==='design' && slot.showName){
          const label = document.createElement('div');
          label.className = 'tpl-slot-label is-ghost';
          label.textContent = 'Nom';
          wrap.appendChild(label);
        }
        if (mode==='design' && slot.role){
          const roleTag = document.createElement('div');
          roleTag.className = 'tpl-slot-role';
          roleTag.textContent = slot.role;
          wrap.appendChild(roleTag);
        }
        if (mode==='compo' && player && extra.captainSlotId===slot.id){
          const cap = document.createElement('div');
          cap.className = 'slot-captain-badge';
          cap.textContent = 'C';
          wrap.appendChild(cap);
        }
      }
    }

    container.appendChild(wrap);

    if (mode==='design'){
      bindSlotDrag(wrap, canvasEl, template, slot);
      wrap.addEventListener('click', ()=>{
        if (wrap.dataset.dragged==='1'){ wrap.dataset.dragged='0'; return; }
        selectSlot(slot.id);
      });
    } else if (mode==='compo'){
      if (extra.adjustMode){
        bindCompoSlotAdjust(wrap, canvasEl, extra.post, slot);
      } else {
        wrap.addEventListener('click', ()=> extra.onSlotTap(slot.id));
      }
    }
  });

  if (mode==='design'){
    canvasEl.onclick = (e)=>{
      if (e.target.closest('.tpl-slot')) return;
      if (!state.design.addMode) return;
      const rect = canvasEl.getBoundingClientRect();
      const x = clamp((e.clientX-rect.left)/rect.width, 0.03, 0.97);
      const y = clamp((e.clientY-rect.top)/rect.height, 0.03, 0.97);
      addSlot(template, x, y);
    };
  } else {
    canvasEl.onclick = null;
  }
}

function bindSlotDrag(wrap, canvasEl, template, slot){
  const isText = (slot.kind||'photo')==='text';
  const resizeHandle = document.createElement('div');
  resizeHandle.className = 'tpl-slot-resize';
  wrap.appendChild(resizeHandle);

  function start(e, mode){
    e.stopPropagation();
    e.preventDefault();
    const pid = e.pointerId;
    wrap.setPointerCapture(pid);
    let startX = e.clientX, startY = e.clientY, moved = false;
    const rect = canvasEl.getBoundingClientRect();
    function move(ev){
      if (ev.pointerId !== pid) return;
      const dx = ev.clientX-startX, dy = ev.clientY-startY;
      if (Math.abs(dx)>4 || Math.abs(dy)>4) moved = true;
      if (mode==='move'){
        slot.x = clamp(slot.x + dx/rect.width, 0.02, 0.98);
        slot.y = clamp(slot.y + dy/rect.height, 0.02, 0.98);
        applySnap(slot, template);
        wrap.style.left = (slot.x*100)+'%';
        wrap.style.top = (slot.y*100)+'%';
      } else if (isText){
        slot.w = clamp(slot.w + dx/rect.width, 0.08, 0.9);
        slot.h = clamp((slot.h!=null?slot.h:0.08) + dy/rect.height, 0.04, 0.5);
        wrap.style.width = (slot.w*100)+'%';
        wrap.style.height = (slot.h*100)+'%';
      } else {
        const delta = (dx+dy)/2/rect.width;
        slot.w = clamp(slot.w + delta, 0.05, 0.4);
        wrap.style.width = (slot.w*100)+'%';
      }
      startX = ev.clientX; startY = ev.clientY;
    }
    function up(ev){
      if (ev.pointerId !== pid) return;
      wrap.removeEventListener('pointermove', move);
      wrap.removeEventListener('pointerup', up);
      try{ wrap.releasePointerCapture(pid); }catch(err){}
      hideGuides();
      if (moved){ wrap.dataset.dragged = '1'; persistSlots(template); }
    }
    wrap.addEventListener('pointermove', move);
    wrap.addEventListener('pointerup', up);
  }
  wrap.addEventListener('pointerdown', (e)=> start(e, 'move'));
  resizeHandle.addEventListener('pointerdown', (e)=> start(e, 'resize'));
}
function bindCompoSlotAdjust(wrap, canvasEl, post, slot){
  const isText = (slot.kind||'photo')==='text';
  const resizeHandle = document.createElement('div');
  resizeHandle.className = 'tpl-slot-resize';
  wrap.appendChild(resizeHandle);

  function start(e, mode){
    e.stopPropagation();
    e.preventDefault();
    const pid = e.pointerId;
    wrap.setPointerCapture(pid);
    let startX = e.clientX, startY = e.clientY, moved = false;
    const rect = canvasEl.getBoundingClientRect();
    const es = effectiveSlot(slot, post.slotOverrides);
    let curX = es.x, curY = es.y, curW = es.w, curH = es.h!=null ? es.h : 0.08;
    function move(ev){
      if (ev.pointerId !== pid) return;
      const dx = ev.clientX-startX, dy = ev.clientY-startY;
      if (Math.abs(dx)>4 || Math.abs(dy)>4) moved = true;
      if (mode==='move'){
        curX = clamp(curX + dx/rect.width, 0.02, 0.98);
        curY = clamp(curY + dy/rect.height, 0.02, 0.98);
        wrap.style.left = (curX*100)+'%';
        wrap.style.top = (curY*100)+'%';
      } else if (isText){
        curW = clamp(curW + dx/rect.width, 0.08, 0.9);
        curH = clamp(curH + dy/rect.height, 0.04, 0.5);
        wrap.style.width = (curW*100)+'%';
        wrap.style.height = (curH*100)+'%';
      } else {
        const delta = (dx+dy)/2/rect.width;
        curW = clamp(curW + delta, 0.05, 0.4);
        wrap.style.width = (curW*100)+'%';
      }
      startX = ev.clientX; startY = ev.clientY;
    }
    function up(ev){
      if (ev.pointerId !== pid) return;
      wrap.removeEventListener('pointermove', move);
      wrap.removeEventListener('pointerup', up);
      try{ wrap.releasePointerCapture(pid); }catch(err){}
      if (moved){
        if (!post.slotOverrides) post.slotOverrides = {};
        const ov = post.slotOverrides[slot.id] || {};
        ov.x = curX; ov.y = curY; ov.w = curW;
        if (isText) ov.h = curH;
        post.slotOverrides[slot.id] = ov;
        saveCompo(false).catch(err=> console.error('saveCompo failed', err));
      }
    }
    wrap.addEventListener('pointermove', move);
    wrap.addEventListener('pointerup', up);
  }
  wrap.addEventListener('pointerdown', (e)=> start(e, 'move'));
  resizeHandle.addEventListener('pointerdown', (e)=> start(e, 'resize'));
}
function hideGuides(){
  const gv = document.getElementById('guideV'), gh = document.getElementById('guideH');
  if (gv) gv.hidden = true;
  if (gh) gh.hidden = true;
}
function applySnap(slot, template){
  const gv = document.getElementById('guideV'), gh = document.getElementById('guideH');
  if (!state.design.snapEnabled){ hideGuides(); return; }
  const threshold = 0.012;
  const xs = template.slots.filter(s=>s.id!==slot.id).map(s=>s.x).concat([0.5]);
  const ys = template.slots.filter(s=>s.id!==slot.id).map(s=>s.y).concat([0.5]);
  let snapX = null, snapY = null;
  for (const ox of xs){ if (Math.abs(slot.x-ox) < threshold){ snapX = ox; break; } }
  for (const oy of ys){ if (Math.abs(slot.y-oy) < threshold){ snapY = oy; break; } }
  if (snapX!=null) slot.x = snapX;
  if (snapY!=null) slot.y = snapY;
  if (gv){ gv.hidden = snapX==null; if (snapX!=null) gv.style.left = (snapX*100)+'%'; }
  if (gh){ gh.hidden = snapY==null; if (snapY!=null) gh.style.top = (snapY*100)+'%'; }
}

function rerenderCurrentCanvas(){
  if (state.view==='design' && state.design.subview==='editor'){
    const canvasEl = document.getElementById('tplCanvas');
    const container = document.getElementById('tplSlots');
    if (canvasEl && container) renderSlotsInCanvas(container, canvasEl, state.design.template, 'design');
  }
  if (state.view==='compo' && state.compo.subview==='editor'){
    const canvasEl = document.getElementById('compoCanvas');
    const container = document.getElementById('compoSlots');
    if (canvasEl && container){
      const ids = slotAssignmentPhotoIds(state.compo.template, state.compo.compo.assignments, state.compo.compo.photoChoices);
      warmPhotoCache(ids).then(()=> renderSlotsInCanvas(container, canvasEl, state.compo.template, 'compo', {
        assignments: state.compo.compo.assignments,

      }));
    }

}
function rerenderAndSaveCompo(){
  rerenderCurrentCanvas();
  saveCompo(false).catch(err=> console.error('saveCompo failed', err));
}
function effectiveSlot(slot, overrides){
  const o = overrides && overrides[slot.id];
  if (!o) return slot;
  return {
    ...slot,
    x: o.x!=null ? o.x : slot.x,
    y: o.y!=null ? o.y : slot.y,
    w: o.w!=null ? o.w : slot.w,
    h: o.h!=null ? o.h : slot.h,
  };
}
function resolvePlayerPhotoAssetId(player, template, photoChoices, slotId){
  const extras = player.photos || [];
  const chosenId = photoChoices ? photoChoices[slotId] : null;
  if (chosenId){
    const chosen = extras.find(p=>p.id===chosenId);
    if (chosen && chosen.photoAssetId) return chosen.photoAssetId;
  }
  const catLabel = CATEGORY_LABELS[template.category];
  if (catLabel){
    const match = extras.find(p=>p.label===catLabel && p.photoAssetId);
    if (match) return match.photoAssetId;
  }
  return player.photoAssetId || null;
}
function slotAssignmentPhotoIds(template, assignments, photoChoices){
  const ids = [];
  (template.slots||[]).forEach(slot=>{
    const kind = slot.kind || 'photo';
    const val = assignments[slot.id];
    if (!val) return;
    if (kind==='logo') ids.push(val);
    else if (kind==='photo'){
      const p = state.players.find(pp=>pp.id===val);
      if (p) ids.push(resolvePlayerPhotoAssetId(p, template, photoChoices, slot.id));
    }
  });
  return ids;
}

async function persistTemplate(template){
  // template is a full clone of the record (see openTemplateEditor), so write it
  // straight through and patch state.templates from the result — avoids the
  // get-then-put-then-refetch-everything chain that made every single edit in
  // the Design editor wait on up to 3 sequential network round-trips.
  const saved = await idbPut('templates', {...template});
  const idx = state.templates.findIndex(t=>t.id===template.id);
  if (idx>=0) state.templates[idx] = saved; else state.templates.push(saved);
  return saved;
}
function persistSlots(template){
  persistTemplate(template).catch(err=> console.error('persistSlots failed', err));
}

function addSlot(template, x, y){
  const slot = { id: 's'+Math.random().toString(36).slice(2,9), x, y, w:0.16, h:0.08, shape:'oval', kind:'photo', showName:true, showNumber:true, role:'', fontSize:0.12, color:'#ffffff', placeholder:'Texte libre' };
  template.slots.push(slot);
  persistSlots(template);
  rerenderCurrentCanvas();
  selectSlot(slot.id);
}

}

async function createTemplateFromFile(file, format, category){
  showBusy('Import du visuel…');
  try{
    const fmt = IG_FORMATS[format] || IG_FORMATS.square;
    const result = fmt.w
      ? await resizeImageToExact(file, fmt.w, fmt.h, 0.88)
      : await resizeImage(file, 2000, 0.88);
    const photoId = await storePhoto(result.blob);
    const data = { id:newId(), name:'Nouveau template', category, bgAssetId:photoId, bgW:result.width, bgH:result.height, slots:[], createdAt:new Date().toISOString() };
    const saved = await idbPut('templates', data);
    state.templates.push(saved);
    openTemplateEditor(data.id);
  }catch(err){
    console.error(err);
    toast('Import impossible, réessaie');
  }finally{
    hideBusy();
  }
}
async function duplicateTemplate(id){
  const t = state.templates.find(x=>x.id===id);
  if (!t) return;
  const data = { id:newId(), name:(t.name||'Template')+' (copie)', category:t.category||'compo', bgAssetId:t.bgAssetId, bgW:t.bgW, bgH:t.bgH, slots:(t.slots||[]).map(s=>({...s})), createdAt:new Date().toISOString() };
  const saved = await idbPut('templates', data);
  state.templates.push(saved);
  renderDesignView();
  toast('Template dupliqué');
}
function openTemplateEditor(id){

/* ---------- effectif view ---------- */
function sortedPlayers(){
  const list = [...state.players];
  if (state.effectif.sort==='name'){
    list.sort((a,b)=> String(a.name).localeCompare(String(b.name)));
  } else {
    list.sort((a,b)=> (a.number??999)-(b.number??999) || String(a.name).localeCompare(String(b.name)));
  }
  const q = state.effectif.query.trim().toLowerCase();
  if (!q) return list;
  return list.filter(p=> (String(p.name)+' '+playerPositionsText(p)).toLowerCase().includes(q));
}
function findDuplicatePlayers(){
  const groups = new Map();
  for (const p of state.players){
    const key = String(p.name||'').trim().toLowerCase();
    if (!key) continue;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(p);
  }
  return [...groups.values()].filter(g=>g.length>1);
}
function renderEffectifView(){
  const root = els.viewEffectif;
  const dupGroups = findDuplicatePlayers();
  const dupCount = dupGroups.reduce((n,g)=> n+g.length-1, 0);
  root.innerHTML = `
    <div class="view-toolbar">
      <h2>Effectif</h2>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-secondary" id="btnImportPlayers">Importer une liste</button>
        <button class="btn btn-accent" id="btnAddPlayer">+ Joueur</button>
      </div>
    </div>
    ${dupCount>0? `<p class="hint-banner">${dupCount} doublon${dupCount>1?'s':''} détecté${dupCount>1?'s':''} (même nom). <a href="#" id="btnDedupe" style="color:var(--accent);">Nettoyer automatiquement</a></p>` : ''}
    ${state.players.length===0 ? '' : `
    <div class="list-controls">
      <input type="search" id="efSearch" class="search-input" placeholder="Rechercher un joueur ou un poste…" value="${escapeAttr(state.effectif.query)}" style="margin-bottom:0;">
      <div class="chip-row">
        <button type="button" class="chip ${state.effectif.sort==='number'?'chip-active':''}" data-sort="number">Tri : N°</button>
        <button type="button" class="chip ${state.effectif.sort==='name'?'chip-active':''}" data-sort="name">Tri : Nom</button>
      </div>
    </div>`}
    <div id="efListWrap"></div>
  `;
  root.querySelector('#btnDedupe')?.addEventListener('click', (e)=>{
    e.preventDefault();
    confirmDialog(
      `Supprimer ${dupCount} doublon${dupCount>1?'s':''} ?`,
      'Pour chaque nom en double, on garde la fiche la plus complète (avec photo/poste en priorité) et on supprime les autres. Non réversible.',
      async ()=>{
        closeSheet();
        showBusy('Vérification…');
        const log = [];
        try{
          await ensureSession();
          await refreshPlayers();
          const freshDupGroups = findDuplicatePlayers();
          log.push(`Doublons détectés après rafraîchissement : ${freshDupGroups.length} groupe(s), ${freshDupGroups.reduce((n,g)=>n+g.length,0)} fiche(s) au total.`);
          if (!navigator.onLine || !sb){
            hideBusy();
            toast('Connexion nécessaire pour nettoyer les doublons — réessaie une fois en ligne');
            renderEffectifView();
            return;
          }
          let removedCount = 0, failedCount = 0;
          showBusy('Nettoyage…');
          for (const group of freshDupGroups){
            const sorted = [...group].sort((a,b)=>{
              const score = p => (p.photoAssetId?2:0) + (playerPositions(p).length?1:0);
              return score(b) - score(a);
            });
            const [keep, ...remove] = sorted;
            log.push(`« ${keep.name} » : ${sorted.length} fiches, conserve ${keep.id.slice(0,8)} (photo=${!!keep.photoAssetId}, postes=${playerPositions(keep).join('/')||'aucun'})`);
            for (const p of remove){
              try{
                const synced = await idbDelete('players', p.id);
                if (synced){
                  removedCount++;
                  log.push(`  ✓ supprimé ${p.id.slice(0,8)} (synced=true)`);
                } else {
                  failedCount++;
                  log.push(`  ⏳ ${p.id.slice(0,8)} mis en attente hors-ligne (synced=false) — supprimé localement, sera retiré du serveur dès la reconnexion`);
                }
              }catch(err){
                console.error('dedupe delete failed for', p.id, err);
                failedCount++;
                log.push(`  ✗ ÉCHEC ${p.id.slice(0,8)} : ${(err && (err.message||err.details)) || err}`);
              }
            }
          }
          await refreshPlayers();
          const stillDup = findDuplicatePlayers();
          log.push(`Après nettoyage : ${state.players.length} joueurs au total, ${stillDup.length} groupe(s) encore en double.`);
          openSheet((body)=>{
            body.innerHTML = `
              <h3 class="sheet-title">Résultat du nettoyage</h3>
              <textarea readonly rows="14" style="font-family:monospace;font-size:.7rem;width:100%;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:.6em .7em;">${escapeHTML(log.join('\n'))}</textarea>
              <div class="sheet-actions"><button type="button" class="btn btn-accent btn-block" id="dedupeResultClose">Fermer</button></div>
            `;
            body.querySelector('#dedupeResultClose').addEventListener('click', closeSheet);
          });
        }catch(err){
          console.error(err);
          log.push('ERREUR : ' + (err && (err.message||err.details)) || String(err));
          toast('Erreur pendant le nettoyage : ' + (err.message||err));
        }finally{
          hideBusy();
          renderEffectifView();
        }
      }
    );
  });
  root.querySelector('#btnAddPlayer')?.addEventListener('click', ()=> openPlayerForm());
  root.querySelector('#btnImportPlayers')?.addEventListener('click', ()=> openImportPlayersSheet());
  const search = root.querySelector('#efSearch');
  search?.addEventListener('input', ()=>{
    state.effectif.query = search.value;
    renderEffectifList();
  });
  root.querySelectorAll('[data-sort]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.effectif.sort = btn.dataset.sort;
      renderEffectifView();
    });
  });
  renderEffectifList();
}

        const file = e.target.files[0];
        if (!file) return;
        const {blob} = await resizeImage(file, 800, 0.85);
        pendingPhotoBlob = blob;
        draw();
      });
      let pendingLabel = null;
      body.querySelectorAll('[data-add-label]').forEach(chip=>{
        chip.addEventListener('click', ()=>{
          pendingLabel = chip.dataset.addLabel;
          body.querySelector('#extraPhotoInput').click();
        });
      });
      body.querySelector('#extraPhotoInput').addEventListener('change', async (e)=>{
        const file = e.target.files[0];
        e.target.value = '';
        if (!file || !pendingLabel) return;
        const {blob} = await resizeImage(file, 800, 0.85);
        const tempId = newId();
        pendingExtraBlobs[tempId] = blob;
        extraPhotos.push({ id: tempId, label: pendingLabel, photoAssetId: null });
        draw();
      });
      body.querySelectorAll('[data-remove-extra]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const id = btn.dataset.removeExtra;
          extraPhotos = extraPhotos.filter(p=>p.id!==id);
          delete pendingExtraBlobs[id];
          draw();
        });
      });
      body.querySelector('#btnCancel').addEventListener('click', closeSheet);
      body.querySelector('#btnDelete')?.addEventListener('click', ()=>{
        confirmDialog('Supprimer ce joueur ?', 'Il sera retiré des compositions existantes.', async ()=>{
          const synced = await idbDelete('players', player.id);
          state.players = state.players.filter(p=>p.id!==player.id);
          closeSheet();
          renderEffectifView();
          toast(synced ? 'Joueur supprimé' : 'Joueur supprimé localement — en attente de connexion pour synchroniser');
        });
      });
      body.querySelector('#btnSave').addEventListener('click', async ()=>{
        const name = body.querySelector('#fName').value.trim();
        if (!name){ toast('Le nom est requis'); return; }
        const numberVal = body.querySelector('#fNumber').value;
        const btn = body.querySelector('#btnSave');
        btn.disabled = true; btn.textContent = 'Enregistrement…';
        try{
          if (pendingPhotoBlob){
            photoAssetId = await storePhoto(pendingPhotoBlob);
          }
          for (const p of extraPhotos){
            if (pendingExtraBlobs[p.id]){
              p.photoAssetId = await storePhoto(pendingExtraBlobs[p.id]);
            }
          }
          const data = { name, number: numberVal===''?null:Number(numberVal), positions: [...selectedPositions], photoAssetId: photoAssetId||null, photos: extraPhotos.map(p=>({id:p.id, label:p.label, photoAssetId:p.photoAssetId})) };
          let saved;
          // player already holds the full current record in memory, so merge and
          // write it directly instead of idbUpdate's get-then-put — and patch
          // state.players locally instead of a full refreshPlayers() re-fetch.
          if (isEdit){ saved = await idbPut('players', {...player, ...data}); }
          else { data.id = newId(); data.createdAt = new Date().toISOString(); saved = await idbPut('players', data); }
          const idx = state.players.findIndex(x=>x.id===saved.id);
          if (idx>=0) state.players[idx] = saved; else state.players.push(saved);
          closeSheet();
          renderEffectifView();
          if (saved && saved._synced === false){
            toast((isEdit? 'Modif enregistrée':'Joueur ajouté') + ' localement — en attente de connexion pour synchroniser');
          } else {
            toast(isEdit? 'Joueur mis à jour':'Joueur ajouté');
            verifyWrite('players', saved.id, saved, ['name','number','positions','photoAssetId']).then(ok=>{
              if (!ok){
                toast('⚠ Le serveur n’a pas la même version — retente la modif ou vérifie ta connexion');
                refreshPlayers().then(()=>{ if (state.view==='effectif') renderEffectifView(); });
              }
            });
          }
        }catch(err){
          console.error(err);
          toast('Erreur, réessaie');
          btn.disabled = false; btn.textContent = 'Enregistrer';
        }
      });
    }
    draw();
  });
}

function parsePlayerLine(line){
  line = line.trim();
  if (!line) return null;
  let rest = line, positionText = null;
  const sepMatch = rest.match(/^(.*?)\s*[,;|]\s*(.+)$/) || rest.match(/^(.*?)\s+-\s+(.+)$/);
  if (sepMatch){ rest = sepMatch[1].trim(); positionText = sepMatch[2].trim(); }
  let number = null;
  const numMatch = rest.match(/^(\d{1,2})[\.\)\s]+(.*)$/);
  if (numMatch){ number = Number(numMatch[1]); rest = numMatch[2].trim(); }
  const name = rest.trim();
  if (!name) return null;
  let positions = [];
  if (positionText){
    positions = positionText.split(/[\/+&]|\s+ou\s+/i).map(s=>s.trim()).filter(Boolean)
      .map(s=> POSITIONS.find(p=> p.toLowerCase()===s.toLowerCase()))
      .filter(Boolean);
  }
  return { name, number, positions };
}
function openImportPlayersSheet(){
  openSheet((body)=>{

      <p class="sheet-msg" style="margin-top:-10px;font-family:var(--font-display);">9 Jules Martin, Demi de mêlée<br>Jules Martin<br>12. Paul Durand - Pilier/Talonneur</p>

10 Paul Durand, Ouverture
Sacha Petit"></textarea>
      </label>
      <p class="sheet-msg" id="importPreview"></p>
      <div class="sheet-actions">
        <button type="button" class="btn btn-ghost" id="importCancel">Annuler</button>
        <button type="button" class="btn btn-accent" id="importSubmit">Importer</button>
      </div>
    `;
    const textarea = body.querySelector('#importText');
    const preview = body.querySelector('#importPreview');
    function updatePreview(){
      const lines = textarea.value.split('\n').map(parsePlayerLine).filter(Boolean);
      preview.textContent = lines.length ? `${lines.length} joueur${lines.length>1?'s':''} détecté${lines.length>1?'s':''}.` : '';
    }
    textarea.addEventListener('input', updatePreview);
    body.querySelector('#importCancel').addEventListener('click', closeSheet);
    body.querySelector('#importSubmit').addEventListener('click', async ()=>{
      const parsed = textarea.value.split('\n').map(parsePlayerLine).filter(Boolean);
      if (parsed.length===0){ toast('Aucun joueur détecté'); return; }
      const btn = body.querySelector('#importSubmit');
      btn.disabled = true; btn.textContent = 'Import…';
      const existingNames = new Set(state.players.map(p=> String(p.name||'').trim().toLowerCase()));
      let created = 0, skipped = 0, pending = 0;
      try{
        for (const p of parsed){
          const key = p.name.trim().toLowerCase();
          if (existingNames.has(key)){ skipped++; continue; }
          const saved = await idbPut('players', {
            id: newId(), name: p.name, number: p.number, positions: p.positions||[],
            photoAssetId: null, photos: [], createdAt: new Date().toISOString(),
          });
          if (saved && saved._synced === false) pending++;
          state.players.push(saved);
          existingNames.add(key);
          created++;
        }
        closeSheet();
        renderEffectifView();
        toast(`${created} joueur${created>1?'s':''} ajouté${created>1?'s':''}`
          + (skipped? `, ${skipped} déjà présent${skipped>1?'s':''} ignoré${skipped>1?'s':''}` : '')
          + (pending? ` — ${pending} en attente de connexion pour synchroniser` : ''));
      }catch(err){
        console.error(err);
        await refreshPlayers();
        toast('Erreur : ' + (err && (err.message || err.details || JSON.stringify(err))) + ` (${created} déjà ajoutés avant l’erreur, relance sans risque de doublon)`);
        btn.disabled = false; btn.textContent = 'Importer';
      }
    });
  });
}

async function saveCompo(showToast){
  const c = state.compo.compo;
  if (!c) return;
  // c is already a full clone of the post (id/templateId/createdAt included), so
  // write it straight through and patch local state from the result instead of
  // doing a get-then-put (idbUpdate) followed by a full list re-fetch — that
  // chain meant up to 3 sequential network round-trips for a single tap.
  c.updatedAt = new Date().toISOString();
  const saved = await idbPut('posts', {...c});
  const idx = state.compos.findIndex(x=>x.id===c.id);
  if (idx>=0) state.compos[idx] = saved; else state.compos.push(saved);
  if (showToast){
    toast(saved._synced===false ? 'Enregistré localement — en attente de connexion' : 'Composition enregistrée');
    // Only verify on the explicit "Enregistrer" tap, not the silent auto-save
    // that fires on every slot interaction — a network round-trip there would
    // undo the latency work done on every single tap.
    if (saved._synced!==false){
      verifyWrite('posts', saved.id, saved, ['assignments','captainSlotId','photoChoices','slotOverrides']).then(ok=>{
        if (!ok) toast('⚠ Le serveur n’a pas la même version — retente ou vérifie ta connexion');
      });
    }
  }
}

/* ---------- export ---------- */
async function renderCompoCanvasBlob(tpl, c){
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const canvas = document.createElement('canvas');
  canvas.width = tpl.bgW; canvas.height = tpl.bgH;
  const ctx = canvas.getContext('2d');
  const bgBitmap = await loadBitmapForPhoto(tpl.bgAssetId);
  if (bgBitmap) ctx.drawImage(bgBitmap, 0, 0, tpl.bgW, tpl.bgH);

  for (const slot of (tpl.slots||[])){
    const kind = slot.kind || 'photo';
    const val = c.assignments[slot.id];
    if (!val) continue;
    const es = effectiveSlot(slot, c.slotOverrides);

    if (kind==='text'){
      const cx = es.x*tpl.bgW, cy = es.y*tpl.bgH;
      const boxW = es.w*tpl.bgW, boxH = (es.h!=null?es.h:0.08)*tpl.bgH;
      const fontPx = (slot.fontSize!=null?slot.fontSize:0.12) * boxW;
      ctx.save();
      ctx.font = `700 ${Math.round(fontPx)}px Oswald, "Arial Narrow", sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const lines = wrapText(ctx, String(val), boxW);
      const lineH = fontPx * 1.15;
      let ty = cy - (lines.length-1)*lineH/2;
      for (const line of lines){
        strokeFillText(ctx, line, cx, ty, fontPx, 'Oswald, "Arial Narrow", sans-serif', 700, slot.color||'#ffffff', 0.16);
        ty += lineH;
      }
      ctx.restore();
      continue;
    }

    const cx = es.x*tpl.bgW, cy = es.y*tpl.bgH, d = es.w*tpl.bgW, r = d/2;

    if (kind==='logo'){
      const bitmap = await loadBitmapForPhoto(val);
      if (bitmap){
        ctx.save();
        pathForSlot(ctx, slot, cx, cy, r, d);
        ctx.clip();
        drawCover(ctx, bitmap, cx-r, cy-r, d, d);
        ctx.restore();
      }
      ctx.save();
      pathForSlot(ctx, slot, cx, cy, r, d);
      ctx.lineWidth = Math.max(2, d*0.03);
      ctx.strokeStyle = '#000000';
      ctx.stroke();
      ctx.restore();
      continue;
    }

    // kind === 'photo'
    const player = state.players.find(p=>p.id===val);
    if (!player) continue;
    const resolvedPhotoId = resolvePlayerPhotoAssetId(player, tpl, c.photoChoices, slot.id);

    if (resolvedPhotoId){
      const bitmap = await loadBitmapForPhoto(resolvedPhotoId);
      if (bitmap){
        ctx.save();
        pathForSlot(ctx, slot, cx, cy, r, d);
        ctx.clip();
        drawCover(ctx, bitmap, cx-r, cy-r, d, d);
        ctx.restore();
      }
    }
    ctx.save();
    pathForSlot(ctx, slot, cx, cy, r, d);
    ctx.lineWidth = Math.max(2, d*0.035);
    ctx.strokeStyle = '#000000';
    ctx.stroke();
    ctx.restore();

    if (slot.showNumber && player.number!=null){
      const fontPx = d*0.58;
      strokeFillText(ctx, String(player.number), cx, cy + r, fontPx, 'Oswald, "Arial Narrow", sans-serif', 700, '#ffffff', 0.15, 'center', 'middle');
    }
    if (slot.showName && player.name){
      const text = String(player.name).toUpperCase();
      const fontPx = d*0.15;
      const ty = cy + r + d*0.30;
      strokeFillText(ctx, text, cx, ty, fontPx, '"Work Sans", sans-serif', 700, '#ffffff', 0.16, 'center', 'top');
    }
    if (c.captainSlotId===slot.id){
      const br = d*0.13;
      const bx = cx + r*0.62, by = cy + r*0.30;
      ctx.save();
      ctx.beginPath(); ctx.arc(bx,by,br,0,Math.PI*2);
      ctx.fillStyle = '#ffffff'; ctx.fill();
      ctx.lineWidth = Math.max(1.5, br*0.16); ctx.strokeStyle = '#000000'; ctx.stroke();
      ctx.fillStyle = '#000000';
      ctx.font = `700 ${Math.round(br*1.3)}px Oswald, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('C', bx, by+br*0.06);
      ctx.restore();
    }
  }

  return await new Promise(res=> canvas.toBlob(res, 'image/png'));
}
function wrapText(ctx, text, maxWidth){
  const words = String(text).split(/\s+/).filter(Boolean);
  const lines = [];
  let line = '';
  for (const word of words){
    const test = line ? line+' '+word : word;
    if (ctx.measureText(test).width > maxWidth && line){
      lines.push(line);
      line = word;
    } else {
      line = test;
    }
  }
  if (line) lines.push(line);
  return lines.length ? lines : [''];
}

async function exportCompo(){

  if (!tpl){ toast('Export indisponible'); return; }

async function exportCarousel(ids){
  if (ids.length===0) return;
  showBusy(`Génération 0/${ids.length}…`);
  try{
    const items = [];
    for (let i=0;i<ids.length;i++){
      const post = state.compos.find(p=>p.id===ids[i]);
      const tpl = post ? state.templates.find(t=>t.id===post.templateId) : null;
      if (!post || !tpl) continue;
      showBusy(`Génération ${i+1}/${ids.length}…`);
      const blob = await renderCompoCanvasBlob(tpl, post);
      items.push({ post, blob });

function blobToDataURL(blob){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}
async function exportAllData(){
  showBusy('Préparation de l’export…');
  try{
    const [players, templates, posts, logos, settings] = await Promise.all([
      idbGetAll('players'), idbGetAll('templates'), idbGetAll('posts'), idbGetAll('logos'), idbGet('settings','app'),
    ]);
    const photoIds = new Set();
    players.forEach(p=>{
      if (p.photoAssetId) photoIds.add(p.photoAssetId);
      (p.photos||[]).forEach(ph=> ph.photoAssetId && photoIds.add(ph.photoAssetId));
    });
    templates.forEach(t=> t.bgAssetId && photoIds.add(t.bgAssetId));
    logos.forEach(l=> l.photoAssetId && photoIds.add(l.photoAssetId));
    const photos = {};
    for (const id of photoIds){
      const blob = await getPhotoBlobById(id);
      if (blob) photos[id] = await blobToDataURL(blob);
    }
    const bundle = { app:'compo-xv', version:1, exportedAt:new Date().toISOString(), players, templates, posts, logos, settings: settings||null, photos };
    const blob = new Blob([JSON.stringify(bundle)], {type:'application/json'});
    const filename = 'compo-xv-'+formatDateShort(new Date()).replace('/','-')+'.json';
    hideBusy();
    openExportDataReadySheet(blob, filename);
  }catch(err){
    console.error(err);
    toast('Échec de l’export');
    hideBusy();
  }
}

async function importAllData(file){
  showBusy('Import en cours…');
  try{
    const text = await file.text();
    const bundle = JSON.parse(text);
    if (!bundle || bundle.app!=='compo-xv') throw new Error('invalid file');
    // Photos are stored under a path scoped to their original group; re-path them
    // under the current group so uploads pass security checks, and remap references.
    const idMap = {};
    for (const [oldId, dataUrl] of Object.entries(bundle.photos||{})){
      const res = await fetch(dataUrl);
      const blob = await res.blob();
      const ext = (blob.type && blob.type.split('/')[1]) || 'jpg';
      const newPath = `${currentGroup.id}/${newId()}.${ext}`;
      await restorePhotoBlob(newPath, blob);
      idMap[oldId] = newPath;
    }
    const remap = (assetId)=> assetId && idMap[assetId] ? idMap[assetId] : assetId;
    for (const p of bundle.players||[]) await idbPut('players', {
      ...p,
      photoAssetId: remap(p.photoAssetId),
      photos: (p.photos||[]).map(ph=>({...ph, photoAssetId: remap(ph.photoAssetId)})),
    });
    for (const t of bundle.templates||[]) await idbPut('templates', {...t, bgAssetId: remap(t.bgAssetId)});
    for (const l of bundle.logos||[]) await idbPut('logos', {...l, photoAssetId: remap(l.photoAssetId)});
    for (const po of bundle.posts||[]) await idbPut('posts', po);
    if (bundle.settings && bundle.settings.club) await saveClub(bundle.settings.club);
    await loadAll();
    render();
    toast('Import terminé');
  }catch(err){
    console.error(err);
    toast('Fichier invalide ou import impossible');
  }finally{
    hideBusy();
  }
}

async function openDiagnosticSheet(){
  let sessionInfo = 'inconnue';
  let sessionExpiresIn = 'inconnue';
  try{
    const { data } = await sb.auth.getSession();
    if (data && data.session){
      sessionInfo = 'active';
      const expiresAt = data.session.expires_at;
      if (expiresAt){
        const mins = Math.round((expiresAt*1000 - Date.now())/60000);
        sessionExpiresIn = mins>0 ? `expire dans ${mins} min` : `expirée depuis ${-mins} min`;
      }
    } else {
      sessionInfo = 'aucune session';
    }
  }catch(err){ sessionInfo = 'erreur: '+(err.message||err); }

  let counts = { players:'?', templates:'?', posts:'?' };
  try{
    counts.players = (await cacheGetAll('players')).length;
    counts.templates = (await cacheGetAll('templates')).length;
    counts.posts = (await cacheGetAll('posts')).length;
  }catch(err){ console.error(err); }
  let outboxCount = '?';
  let outboxItems = [];
  try{ outboxItems = await cacheGetAll('outbox'); outboxCount = outboxItems.length; }catch(err){}
  const stuck = outboxItems.filter(it=> (it.attempts||0) >= 5);

  const lines = [
    `sb initialisé : ${sb ? 'oui' : 'NON'}`,
    `navigator.onLine : ${navigator.onLine}`,
    `sessionValid (app) : ${sessionValid}`,
    `Session Supabase : ${sessionInfo} (${sessionExpiresIn})`,
    `currentUser : ${currentUser ? currentUser.email : 'NULL'}`,
    `currentGroup : ${currentGroup ? currentGroup.name+' ('+currentGroup.id+', role='+currentGroup.role+')' : 'NULL'}`,
    `state.players (chargés) : ${state.players.length}`,
    `state.templates (chargés) : ${state.templates.length}`,
    `state.compos (chargées) : ${state.compos.length}`,
    `Cache local — joueurs : ${counts.players}, templates : ${counts.templates}, compos : ${counts.posts}`,
    `File d’attente hors-ligne (outbox) : ${outboxCount}`,
    ...(stuck.length ? [
      `⚠ ${stuck.length} modification(s) bloquée(s) après 5+ tentatives :`,
      ...stuck.map(it=> `  - ${it.store}/${it.op} (${it.attempts} essais) : ${it.lastError||'erreur inconnue'}`),
    ] : []),
    `URL Supabase : ${SUPABASE_URL}`,
  ];

  openSheet((body)=>{
    body.innerHTML = `
      <h3 class="sheet-title">Diagnostic technique</h3>
      <p class="sheet-msg" style="margin-top:0;">Fais une capture de cet écran si un problème persiste.</p>
      <textarea readonly rows="14" style="font-family:monospace;font-size:.72rem;width:100%;color:var(--text);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:.6em .7em;">${escapeHTML(lines.join('\n'))}</textarea>
      <div class="sheet-actions">
        <button type="button" class="btn btn-secondary btn-block" id="diagRetry">Forcer une reconnexion</button>
      </div>
      ${outboxCount>0 ? `<div class="sheet-actions">
        <button type="button" class="btn btn-danger btn-block" id="diagClearOutbox">Vider la file d’attente (${outboxCount})</button>
      </div>` : ''}
      <div class="sheet-actions">
        <button type="button" class="btn btn-ghost btn-block" id="diagClose">Fermer</button>
      </div>
    `;
    body.querySelector('#diagRetry').addEventListener('click', async ()=>{
      showBusy('Reconnexion…');
      currentGroup = null;
      await ensureGroup();
      if (currentGroup){ bindRealtime(); await loadAll(); render(); }
      updateOnlineStatus();
      hideBusy();
      closeSheet();
      openDiagnosticSheet();
    });
    body.querySelector('#diagClearOutbox')?.addEventListener('click', ()=>{
      confirmDialog(
        `Vider les ${outboxCount} modification(s) en attente ?`,
        'À utiliser seulement si une ancienne écriture bloquée fait réapparaître des données déjà supprimées ou modifiées. Toute modification pas encore envoyée au serveur sera définitivement perdue.',
        async ()=>{
          try{
            for (const it of outboxItems) await cacheDelete('outbox', it.id);
            toast('File d’attente vidée');
            updateOnlineStatus();
          }catch(err){ console.error(err); toast('Échec du vidage'); }
          closeSheet();
          openDiagnosticSheet();
        }
      );
    });
    body.querySelector('#diagClose').addEventListener('click', closeSheet);
  });
}

/* ---------- online / offline / session status ---------- */
let sessionValid = true;
async function updateOnlineStatus(){
  const pill = els.offlinePill;
  const text = document.getElementById('offlinePillText');
  pill.classList.remove('is-online','is-warning');
  pill.onclick = null;
  if (!navigator.onLine){
    text.textContent = 'Hors ligne';
    pill.title = 'Pas de connexion internet — les modifications seront synchronisées au retour du réseau.';
  } else if (!sessionValid){
    pill.classList.add('is-warning');
    text.textContent = 'Reconnexion';
    pill.title = 'Session expirée, touche ici pour te reconnecter';
    pill.onclick = ()=>{
      document.getElementById('app').hidden = true;
      showAuthScreen();
    };
  } else {
    let pending = 0;
    try{ pending = (await cacheGetAll('outbox')).length; }catch(err){}
    if (pending>0){
      pill.classList.add('is-warning');
      text.textContent = `Synchro… (${pending})`;
      pill.title = `${pending} modification${pending>1?'s':''} en attente d’envoi au serveur — ça se termine automatiquement.`;
    } else {
      pill.classList.add('is-online');
      text.textContent = 'En ligne';
      pill.title = 'Connecté et synchronisé';
    }
  }
}
function markSessionInvalid(){
  if (sessionValid){
    sessionValid = false;
    updateOnlineStatus();
    toast('Session expirée — touche "Reconnexion" en haut de l’écran');
  }
}
function markSessionValid(){
  if (!sessionValid){
    sessionValid = true;
    updateOnlineStatus();
  }
}

/* ---------- auth ---------- */
let authMode = 'signin';
function bindAuthScreen(){
  const tabIn = document.getElementById('authTabSignin');
  const tabUp = document.getElementById('authTabSignup');
  const err = document.getElementById('authError');
  function setMode(mode){
    authMode = mode;
    tabIn.classList.toggle('chip-active', mode==='signin');
    tabUp.classList.toggle('chip-active', mode==='signup');
    document.getElementById('authSubmit').textContent = mode==='signin' ? 'Se connecter' : 'Créer le compte';
    err.hidden = true;
  }
  tabIn.addEventListener('click', ()=> setMode('signin'));
  tabUp.addEventListener('click', ()=> setMode('signup'));
  document.getElementById('authSubmit').addEventListener('click', async ()=>{
    const email = document.getElementById('authEmail').value.trim();
    const password = document.getElementById('authPassword').value;
    if (!email || !password){ err.textContent = 'Renseigne un email et un mot de passe.'; err.hidden = false; return; }
    const btn = document.getElementById('authSubmit');
    btn.disabled = true;
    err.hidden = true;
    try{
      const fn = authMode==='signin' ? sb.auth.signInWithPassword({email, password}) : sb.auth.signUp({email, password});
      const { data, error } = await fn;
      if (error) throw error;
      if (authMode==='signup' && !data.session){
        err.textContent = 'Compte créé. Si une confirmation par email est activée sur le projet, vérifie ta boîte mail, sinon reconnecte-toi.';
        err.hidden = false;
        btn.disabled = false;
        return;
      }
      await afterSignedIn(data.session ? data.session.user : data.user);
    }catch(e){
      err.textContent = e.message || 'Échec de la connexion.';
      err.hidden = false;
      btn.disabled = false;
    }
  });
}
function showAuthScreen(){
  els.loading.hidden = true;
  document.getElementById('groupScreen').hidden = true;
  document.getElementById('authScreen').hidden = false;
}

      await resolveCurrentGroup();
      await startApp();
    }catch(e){ err.textContent = 'Code invalide ou expiré.'; err.hidden = false; }
  });
  document.getElementById('groupSignOut').addEventListener('click', async ()=>{
    await sb.auth.signOut();
    location.reload();
  });
}
function showGroupScreen(){
  els.loading.hidden = true;
  document.getElementById('authScreen').hidden = true;
  document.getElementById('groupScreen').hidden = false;
}
async function resolveCurrentGroup(){
  const { data: memberships, error } = await sb
    .from('group_members')
    .select('group_id, role, groups(id, name, invite_code)')
    .eq('user_id', currentUser.id)
    .limit(1);
  if (error) throw error;
  if (!memberships || memberships.length===0){ currentGroup = null; return; }
  const m = memberships[0];
  currentGroup = { id: m.groups.id, name: m.groups.name, invite_code: m.groups.invite_code, role: m.role };
  localStorage.setItem('compoxv_group', JSON.stringify(currentGroup));
}
async function afterSignedIn(user){
  currentUser = user || currentUser;
  try{
    await resolveCurrentGroup();
  }catch(err){
    console.error('could not resolve group live, trying cache', err);
    try{
      const cached = localStorage.getItem('compoxv_group');
      currentGroup = cached ? JSON.parse(cached) : null;
    }catch(e2){ currentGroup = null; }
  }
  if (!currentGroup){ showGroupScreen(); bindGroupScreen(); return; }
  await startApp();
}
async function startApp(){
  document.getElementById('authScreen').hidden = true;
  document.getElementById('groupScreen').hidden = true;
  showBusy('Chargement des données…');
  try{
    await loadAll();
  }catch(err){ console.error(err); }
  hideBusy();
  els.app.hidden = false;
  sessionValid = true;
  updateOnlineStatus();
  let lastView = 'compo';
  try{
    const saved = localStorage.getItem('compoxv_view');
    if (saved && ['compo','effectif','design'].includes(saved)) lastView = saved;
  }catch(err){}
  switchView(lastView);
  replayOutbox();
  bindRealtime();
}
let realtimeChannel = null;
function bindRealtime(){
  if (!currentGroup) return;
  if (realtimeChannel){
    try{ sb.removeChannel(realtimeChannel); }catch(err){ console.error(err); }
    realtimeChannel = null;
  }
  realtimeChannel = sb.channel('group-'+currentGroup.id)
    .on('postgres_changes', { event:'*', schema:'public', table:'players', filter:'group_id=eq.'+currentGroup.id }, onRemoteChange)
    .on('postgres_changes', { event:'*', schema:'public', table:'templates', filter:'group_id=eq.'+currentGroup.id }, onRemoteChange)
    .on('postgres_changes', { event:'*', schema:'public', table:'posts', filter:'group_id=eq.'+currentGroup.id }, onRemoteChange)
    .on('postgres_changes', { event:'*', schema:'public', table:'logos', filter:'group_id=eq.'+currentGroup.id }, onRemoteChange)
    .subscribe();
}
let realtimeRefreshTimer = null;
function onRemoteChange(){
  clearTimeout(realtimeRefreshTimer);
  // Short debounce so a burst of postgres_changes events from one logical
  // operation (e.g. a bulk import) collapses into a single reload, without
  // making a teammate's single edit feel slow to show up.
  realtimeRefreshTimer = setTimeout(async ()=>{
    await loadAll();
    render();
  }, 300);
}

/* ---------- init ---------- */
async function init(){
  bindTabbar();
  bindAuthScreen();
  els.sheetOverlay.addEventListener('click', (e)=>{ if (e.target===els.sheetOverlay) closeSheet(); });
  document.getElementById('btnSettings').addEventListener('click', openSettingsSheet);

  window.addEventListener('online', ()=>{ updateOnlineStatus(); replayOutbox(); });
  window.addEventListener('offline', updateOnlineStatus);
  document.addEventListener('visibilitychange', ()=>{
    if (document.visibilityState==='visible' && !els.app.hidden){
      ensureGroup().then(()=> replayOutbox());
    }
  });
  updateOnlineStatus();

  window.addEventListener('beforeinstallprompt', (e)=>{
    e.preventDefault();
    deferredInstallPrompt = e;
  });

  if ('serviceWorker' in navigator){
    let refreshedOnce = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{
      if (refreshedOnce) return;
      refreshedOnce = true;
      location.reload();
    });
    navigator.serviceWorker.register('sw.js').then((reg)=>{
      reg.update().catch(()=>{});
      setInterval(()=> reg.update().catch(()=>{}), 5*60*1000);
    }).catch(err=> console.error('SW registration failed', err));
  }

  try{
    await openDB();
  }catch(err){
    console.error(err);
    els.loadingText.textContent = 'Impossible d’accéder au stockage local sur cet appareil. Vérifie que la navigation privée / le blocage des cookies n’est pas activé, puis recharge la page.';
    return;
  }

  if (!window.supabase || !window.supabase.createClient){
    els.loadingText.textContent = 'Impossible de charger la librairie Supabase. Vérifie ta connexion puis recharge la page.';
    return;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  sb.auth.onAuthStateChange((event, session)=>{
    if (event==='SIGNED_OUT' || (!session && (event==='TOKEN_REFRESHED' || event==='USER_UPDATED'))){
      if (!els.app.hidden) markSessionInvalid();
    } else if (event==='TOKEN_REFRESHED' || event==='SIGNED_IN'){
      markSessionValid();
    }
  });

  const { data: sessionData } = await sb.auth.getSession();
  if (sessionData && sessionData.session){
    await afterSignedIn(sessionData.session.user);
  } else {
    showAuthScreen();
  }
}

init();
</script>
